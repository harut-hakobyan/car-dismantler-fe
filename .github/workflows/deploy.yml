name: Deploy Frontend Production

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 30m
          script: |
            set -e

            (
              flock -n 9 || {
                echo "Another deployment is already running."
                exit 1
              }

              COMPOSE="docker compose --project-name car-dismantler --env-file .env.production -f docker-compose.production.yml"

              echo "===================================="
              echo "Updating Frontend"
              echo "===================================="

              cd ~/car-dismantler/car-dismantler-fe

              git fetch origin master
              git reset --hard origin/master

              echo "===================================="
              echo "Building Frontend Image"
              echo "===================================="

              cd ~/car-dismantler

              $COMPOSE build --no-cache frontend

              echo "===================================="
              echo "Recreating Frontend Container"
              echo "===================================="

              docker ps -a \
                --format '{{.ID}} {{.Names}}' \
                | awk '$2 ~ /^[a-f0-9]+_car-dismantler-frontend$/ {print $1}' \
                | xargs -r docker rm -f

              $COMPOSE up -d \
                --force-recreate \
                --no-deps \
                frontend

              echo "Waiting for frontend..."
              sleep 10

              echo "===================================="
              echo "Frontend Container Status"
              echo "===================================="

              $COMPOSE ps frontend

              echo "===================================="
              echo "Frontend Health Check"
              echo "===================================="

              curl \
                --fail \
                --retry 20 \
                --retry-delay 3 \
                --retry-connrefused \
                http://127.0.0.1:8080

              echo "===================================="
              echo "Cleaning Unused Docker Images"
              echo "===================================="

              docker image prune -f

              echo "===================================="
              echo "Frontend Deployment Completed"
              echo "===================================="

            ) 9>/tmp/car-dismantler-deploy.lock
